[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "envcheck"
version = "1.0.0"
description = "Audit environment variable usage across your codebase"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["env", "dotenv", "environment", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
envcheck = "envcheck:main"

[project.urls]
Repository = "https://github.com/Jbutler23-ai/envcheck"
Issues = "https://github.com/Jbutler23-ai/envcheck/issues"

[tool.setuptools]
py-modules = ["envcheck"]
packages = []
